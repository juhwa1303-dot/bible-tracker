<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 라이프스터디 진도표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFBFF;
    --ink:#181C2A;
    --ink-soft:#5D6172;
    --ink-faint:#9CA0AF;
    --hairline:#E4E1EC;
    --hairline-soft:#EEECF4;
    --bible:#1849B5;
    --bible-tint:#DCE7FA;
    --bible-tint2:#B9D0F5;
    --bible-wash:#F3F6FD;
    --ls:#1B7A48;
    --ls-tint:#DCF0E4;
    --ls-tint2:#B3DEC3;
    --ls-wash:#F2FAF5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease;
  }
  .wrap{max-width:760px;margin:0 auto;padding:40px 22px 90px;}

  /* ---- header ---- */
  header.title-block{
    text-align:center;
    padding-bottom:26px;
    margin-bottom:28px;
    border-bottom:3px solid var(--bible);
    transition:border-color .25s ease;
  }
  header.title-block h1{
    font-family:'Gothic A1',sans-serif;
    font-weight:700;
    font-size:33px;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  header.title-block p{
    margin:0 auto;
    max-width:420px;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  /* ---- tabs (filled, square) ---- */
  .tabbar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:28px;
  }
  .tabbtn{
    background:var(--hairline-soft);
    border:none;
    padding:13px 28px;
    border-radius:6px;
    font-family:'Gothic A1',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .tabbtn.active[data-tab="bible"]{background:var(--bible);color:#fff;}
  .tabbtn.active[data-tab="ls"]{background:var(--ls);color:#fff;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---- ledger summary ---- */
  .ledger{
    margin-bottom:26px;
    padding:18px 20px;
    border-radius:16px;
  }
  .bible .ledger{background:var(--bible-wash);}
  .ls .ledger{background:var(--ls-wash);}
  .ledger-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:9px 0;
  }
  .ledger-label{
    width:50px;
    flex-shrink:0;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .ledger-bar-track{
    flex:1;
    height:9px;
    border-radius:5px;
    position:relative;
    overflow:hidden;
  }
  .bible .ledger-bar-track{background:var(--bible-tint2);}
  .ls .ledger-bar-track{background:var(--ls-tint2);}
  .ledger-bar-fill{height:100%;width:0%;border-radius:5px;transition:width .35s ease;}
  .bible .ledger-bar-fill{background:var(--bible);}
  .ls .ledger-bar-fill{background:var(--ls);}
  .ledger-pct{
    width:150px;
    text-align:right;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .ledger-pct b{
    font-family:'Gothic A1',sans-serif;
    font-size:19px;
    font-weight:700;
    margin-right:5px;
  }
  .bible .ledger-pct b{color:var(--bible);}
  .ls .ledger-pct b{color:var(--ls);}

  /* ---- completion badge ---- */
  .badge-done{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-weight:700;
    font-size:12.5px;
    padding:4px 12px;
    border-radius:999px;
    color:#fff;
  }
  .badge-done::before{content:"✓";font-size:10px;}
  .bible .badge-done{background:var(--bible);}
  .ls .badge-done{background:var(--ls);}

  /* ---- toolbars ---- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .toolbar.view-toolbar{margin-bottom:8px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    padding:6px 15px;
    font-size:12.5px;
    font-weight:600;
    border-radius:999px;
    border:1.5px solid var(--hairline);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .bible .chip.active{background:var(--bible);color:#fff;border-color:var(--bible);}
  .ls .chip.active{background:var(--ls);color:#fff;border-color:var(--ls);}
  .toolbar-actions{display:flex;gap:14px;}
  .linkbtn{
    background:none;border:none;color:var(--ink-faint);font-size:12px;
    cursor:pointer;padding:4px 2px;font-weight:500;
  }
  .linkbtn:hover{color:var(--ink-soft);}

  /* ---- toc list ---- */
  .toc{margin-top:16px;}
  .book{border-bottom:1px solid var(--hairline);}
  .book:first-child{border-top:1px solid var(--hairline);}
  .book-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 6px;
    cursor:pointer;
    user-select:none;
  }
  .bible .book-head:hover{background:var(--bible-wash);}
  .ls .book-head:hover{background:var(--ls-wash);}
  .book-testament-tag{
    width:9px;height:9px;flex-shrink:0;
    border-radius:50%;
  }
  .bible .book-testament-tag.ot{background:var(--bible);opacity:.4;}
  .bible .book-testament-tag.nt{background:var(--bible);}
  .ls .book-testament-tag.ot{background:var(--ls);opacity:.4;}
  .ls .book-testament-tag.nt{background:var(--ls);}
  .book-name{
    font-family:'Gothic A1',sans-serif;
    font-weight:700;
    font-size:15.5px;
    color:var(--ink);
    width:130px;
    flex-shrink:0;
  }
  .bible .book.open .book-name{color:var(--bible);}
  .ls .book.open .book-name{color:var(--ls);}
  .book-bar-track{
    flex:1;height:5px;border-radius:3px;position:relative;overflow:hidden;
  }
  .bible .book-bar-track{background:var(--bible-tint2);}
  .ls .book-bar-track{background:var(--ls-tint2);}
  .book-bar-fill{height:100%;width:0%;border-radius:3px;}
  .bible .book-bar-fill{background:var(--bible);}
  .ls .book-bar-fill{background:var(--ls);}
  .book-count{
    width:104px;text-align:right;flex-shrink:0;
    font-size:12px;font-weight:600;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .chevron{
    width:12px;flex-shrink:0;
    transition:transform .15s;
    color:var(--ink-faint);
    font-size:11px;
  }
  .book-head-static{cursor:default;}
  .book-head-static:hover{background:none !important;}
  .book.static{border-bottom:1px solid var(--hairline);}
  .book.open .chevron{transform:rotate(90deg);}

  .chapters{
    display:none;
    padding:8px 6px 22px 23px;
  }
  .book.open .chapters{display:block;}

  /* chapter grid (life study) */
  .chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(30px,1fr));
    gap:6px;
    margin-bottom:12px;
    user-select:none;
  }
  .ch-btn{
    aspect-ratio:1;
    border-radius:50%;
    border:1.5px solid var(--hairline);
    background:#fff;
    color:var(--ink-faint);
    font-size:11px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:background .12s,color .12s,border-color .12s;
  }
  .bible .ch-btn.read{background:var(--bible);border-color:var(--bible);color:#fff;}
  .ls .ch-btn.read{background:var(--ls);border-color:var(--ls);color:#fff;}
  .ls .ch-btn{border-color:var(--ls-tint2);}
  .bible .ch-btn{border-color:var(--bible-tint2);}

  /* day-entry list (1년1독) */
  .entry-list{margin-bottom:12px;user-select:none;}
  .entry-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 8px;
    border-radius:10px;
    cursor:pointer;
    transition:background .12s;
  }
  .bible .entry-row:hover{background:var(--bible-wash);}
  .entry-row.read{opacity:.55;}
  .entry-check{
    width:21px;height:21px;flex-shrink:0;
    border-radius:50%;
    border:2px solid var(--bible-tint2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;font-weight:700;
  }
  .entry-row.read .entry-check{background:var(--bible);border-color:var(--bible);}
  .entry-date{
    width:44px;flex-shrink:0;
    font-size:11.5px;font-weight:700;
    color:var(--bible);
    background:var(--bible-tint);
    border-radius:6px;
    padding:3px 0;
    text-align:center;
  }
  .entry-text{font-size:13.5px;color:var(--ink);flex:1;}
  .entry-row.read .entry-text{text-decoration:line-through;color:var(--ink-faint);}

  .book-tools{display:flex;gap:16px;}
  .book-tools button{
    background:none;border:none;color:var(--ink-faint);font-size:12px;font-weight:600;
    cursor:pointer;padding:2px 0;
  }
  .book-tools button:hover{color:var(--ink-soft);}

  .note{
    margin-top:22px;
    font-size:12.5px;
    line-height:1.6;
    color:var(--ink-soft);
    padding:14px 16px;
    border-radius:12px;
  }
  .bible .note{background:var(--bible-wash);}
  .ls .note{background:var(--ls-wash);}

  @media (max-width:480px){
    .wrap{padding:28px 16px 70px;}
    header.title-block h1{font-size:26px;}
    .tabbar{gap:8px;}
    .tabbtn{padding:9px 16px;font-size:14.5px;}
    .book-name{width:82px;font-size:14px;}
    .ledger-label{width:40px;}
    .ledger-pct{width:118px;}
    .book-count{width:78px;font-size:11px;}
    .chapters{padding-left:8px;}
  }
</style>
</head>

/* ---------- id 부여 & 그룹핑 ---------- */
function bookOf(text){
  const token = text.trim().split(/\s+/)[0];
  return ABBR[token] || token;
}
function withIds(raw, prefix){
  const seen = {};
  return raw.map(([date,text])=>{
    const k = date;
    const idx = seen[k] = (seen[k]||0);
    seen[k]++;
    return { id:`${prefix}-${date}-${idx}`, date, text, book: bookOf(text) };
  });
}
const OT_ITEMS = withIds(OT_RAW,'ot');
const NT_ITEMS = withIds(NT_RAW,'nt');

function groupItems(items, keyFn, order){
  const map = {};
  order.forEach(k=>map[k]=[]);
  items.forEach(it=>{
    const k = keyFn(it);
    if(!map[k]) map[k]=[];
    map[k].push(it);
  });
  return order.map(k=>({name:k, entries: map[k]}));
}
function monthKey(it){ return parseInt(it.date.split('/')[0],10)+"월"; }

const BIBLE_BY_BOOK = {
  ot: groupItems(OT_ITEMS, it=>it.book, OT_BOOK_ORDER),
  nt: groupItems(NT_ITEMS, it=>it.book, NT_BOOK_ORDER)
};
const BIBLE_BY_MONTH = {
  ot: groupItems(OT_ITEMS, it=>monthKey(it)+" · 구약", MONTH_ORDER.map(m=>m+" · 구약")),
  nt: groupItems(NT_ITEMS, it=>monthKey(it)+" · 신약", MONTH_ORDER.map(m=>m+" · 신약"))
};

function lsGroup(list){
  return list.map(([name,n])=>({
    name,
    entries: Array.from({length:n},(_,i)=>({id:`${name}-${i+1}`, label:String(i+1)}))
  }));
}
const LS_BY_BOOK = { ot: lsGroup(LS_OT), nt: lsGroup(LS_NT) };

const TRACKS = {
  bible:{ key:"progress:bible", mode:"days",
    note:"각 항목은 업로드하신 '성경 1년 1독 진도표' 파일의 날짜별 본문 구간을 그대로 반영했습니다. 체크하면 이미 읽은 부분은 아래로 내려가고, 아직 읽지 않은 부분이 위로 올라와요." },
  ls:{ key:"progress:lifestudy", mode:"chapters", ot:LS_BY_BOOK.ot, nt:LS_BY_BOOK.nt,
       note:"라이프스터디 단계 수는 진도표 자료를 기준으로 정리했습니다. 빌레몬서·요한삼서·요나처럼 표에 별도 번호가 없던 짧은 책은 1단계로 임시 지정했으니 실제 교재와 다르면 참고만 해주세요." }
};

let STATE = { bible:[], ls:[] };
let FILTER = { bible:"all", ls:"all" };
let VIEWMODE = { bible:"month" };
let OPEN = { bible:new Set(), ls:new Set() };

/* ---------- storage (Claude 아티팩트에서는 window.storage, 일반 웹 호스팅에서는 localStorage로 자동 전환) ---------- */
const HAS_CLAUDE_STORAGE = (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function");
async function loadState(trackId){
  const key = TRACKS[trackId].key;
  try{
    if(HAS_CLAUDE_STORAGE){
      const res = await window.storage.get(key, false);
      STATE[trackId] = res && res.value ? JSON.parse(res.value) : [];
    }else{
      const raw = localStorage.getItem(key);
      STATE[trackId] = raw ? JSON.parse(raw) : [];
    }
  }catch(e){ STATE[trackId] = []; }
}
async function saveState(trackId){
  const key = TRACKS[trackId].key;
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set(key, JSON.stringify(STATE[trackId]), false);
    }else{
      localStorage.setItem(key, JSON.stringify(STATE[trackId]));
    }
  }catch(e){ console.error("save failed", e); }
}
function readSet(trackId){ return new Set(STATE[trackId]||[]); }
function toggleId(trackId, id){
  const set = readSet(trackId);
  if(set.has(id)) set.delete(id); else set.add(id);
  STATE[trackId] = [...set];
}

/* ---------- helpers ---------- */
function countRead(trackId, entries){
  const set = readSet(trackId);
  return entries.filter(e=>set.has(e.id)).length;
}
function totalsFor(trackId, groups){
  let total=0, done=0;
  groups.forEach(g=>{ total+=g.entries.length; done+=countRead(trackId,g.entries); });
  return {total,done};
}
function pct(done,total){ return total? Math.round(done/total*100) : 0; }
function currentGroups(trackId){
  if(trackId==="bible") return VIEWMODE.bible==="month" ? BIBLE_BY_MONTH : BIBLE_BY_BOOK;
  return TRACKS[trackId];
}

/* ---------- render ---------- */
function render(trackId){
  const t = TRACKS[trackId];
  const groups = currentGroups(trackId);
  const all = [...groups.ot.map(g=>({test:"ot",...g})), ...groups.nt.map(g=>({test:"nt",...g}))];
  const otTot = totalsFor(trackId, groups.ot);
  const ntTot = totalsFor(trackId, groups.nt);
  const allTot = { total: otTot.total+ntTot.total, done: otTot.done+ntTot.done };

  const filtered = FILTER[trackId]==="all" ? all : all.filter(g=>g.test===FILTER[trackId]);
  const readSetObj = readSet(trackId);
  const bookViewOnly = trackId==="bible" && VIEWMODE.bible==="book";

  const rows = filtered.map(g=>{
    const name = g.name, test = g.test, entriesRaw = g.entries;
    const done = countRead(trackId, entriesRaw);
    const n = entriesRaw.length;
    const p = pct(done,n);
    const isComplete = n>0 && done===n;

    if(bookViewOnly){
      return `
      <div class="book static" data-book="${name}">
        <div class="book-head book-head-static">
          <span class="book-testament-tag ${test}"></span>
          <span class="book-name">${name}</span>
          <span class="book-bar-track"><span class="book-bar-fill" style="width:${p}%"></span></span>
          <span class="book-count">${isComplete ? '<span class="badge-done">완독</span>' : `${done}/${n} · ${p}%`}</span>
        </div>
      </div>`;
    }

    const isOpen = OPEN[trackId].has(name);
    let entries = entriesRaw;
    if(t.mode === "days"){
      entries = entriesRaw.slice().sort((a,b)=>(readSetObj.has(a.id)?1:0)-(readSetObj.has(b.id)?1:0));
    }

    let inner;
    if(t.mode === "chapters"){
      inner = `<div class="chapter-grid">` + entries.map(e=>
        `<button class="ch-btn entry-toggle ${readSetObj.has(e.id)?'read':''}" data-track="${trackId}" data-id="${e.id}">${e.label}</button>`
      ).join("") + `</div>`;
    }else{
      inner = `<div class="entry-list">` + entries.map(e=>{
        const isRead = readSetObj.has(e.id);
        return `<div class="entry-row entry-toggle ${isRead?'read':''}" data-track="${trackId}" data-id="${e.id}">
          <span class="entry-check">${isRead?'✓':''}</span>
          <span class="entry-date">${e.date}</span>
          <span class="entry-text">${e.text}</span>
        </div>`;
      }).join("") + `</div>`;
    }

    return `
    <div class="book ${isOpen?'open':''}" data-book="${name}">
      <div class="book-head" data-track="${trackId}" data-book="${name}">
        <span class="book-testament-tag ${test}"></span>
        <span class="book-name">${name}</span>
        <span class="book-bar-track"><span class="book-bar-fill" style="width:${p}%"></span></span>
        <span class="book-count">${isComplete ? '<span class="badge-done">완독</span>' : `${done}/${n} · ${p}%`}</span>
        <span class="chevron">▸</span>
      </div>
      <div class="chapters">
        ${inner}
        <div class="book-tools">
          <button data-act="all" data-track="${trackId}" data-book="${name}">전체 읽음</button>
          <button data-act="reset" data-track="${trackId}" data-book="${name}">초기화</button>
        </div>
      </div>
    </div>`;
  }).join("");

  const noteHtml = t.note ? `<div class="note">${t.note}</div>` : "";

  const viewToggleHtml = trackId==="bible" ? `
    <div class="toolbar view-toolbar">
      <div class="chips">
        <span class="chip ${VIEWMODE.bible==='month'?'active':''}" data-track="bible" data-viewmode="month">월별</span>
        <span class="chip ${VIEWMODE.bible==='book'?'active':''}" data-track="bible" data-viewmode="book">권별</span>
      </div>
    </div>` : "";

  const html = `
    <div class="ledger">
      <div class="ledger-row">
        <span class="ledger-label">전체</span>
        <span class="ledger-bar-track"><span class="ledger-bar-fill" style="width:${pct(allTot.done,allTot.total)}%"></span></span>
        <span class="ledger-pct">${allTot.total && allTot.done===allTot.total ? '<span class="badge-done">완독</span>' : `<b>${pct(allTot.done,allTot.total)}%</b> · ${allTot.done}/${allTot.total}`}</span>
      </div>
      <div class="ledger-row">
        <span class="ledger-label">구약</span>
        <span class="ledger-bar-track"><span class="ledger-bar-fill" style="width:${pct(otTot.done,otTot.total)}%"></span></span>
        <span class="ledger-pct">${otTot.total && otTot.done===otTot.total ? '<span class="badge-done">완독</span>' : `<b>${pct(otTot.done,otTot.total)}%</b> · ${otTot.done}/${otTot.total}`}</span>
      </div>
      <div class="ledger-row">
        <span class="ledger-label">신약</span>
        <span class="ledger-bar-track"><span class="ledger-bar-fill" style="width:${pct(ntTot.done,ntTot.total)}%"></span></span>
        <span class="ledger-pct">${ntTot.total && ntTot.done===ntTot.total ? '<span class="badge-done">완독</span>' : `<b>${pct(ntTot.done,ntTot.total)}%</b> · ${ntTot.done}/${ntTot.total}`}</span>
      </div>
    </div>

    ${viewToggleHtml}

    <div class="toolbar">
      <div class="chips">
        <span class="chip ${FILTER[trackId]==='all'?'active':''}" data-track="${trackId}" data-filter="all">전체</span>
        <span class="chip ${FILTER[trackId]==='ot'?'active':''}" data-track="${trackId}" data-filter="ot">구약</span>
        <span class="chip ${FILTER[trackId]==='nt'?'active':''}" data-track="${trackId}" data-filter="nt">신약</span>
      </div>
      <div class="toolbar-actions">
        ${bookViewOnly ? "" : `
        <button class="linkbtn" data-act="expand-all" data-track="${trackId}">모두 펼치기</button>
        <button class="linkbtn" data-act="collapse-all" data-track="${trackId}">모두 접기</button>
        `}
      </div>
    </div>

    <div class="toc">${rows}</div>
    ${noteHtml}
  `;
  document.getElementById(trackId==="bible"?"panel-bible":"panel-ls").innerHTML = html;
}

/* ---------- events ---------- */
const ACCENT = { bible:"#1849B5", ls:"#1B7A48" };

document.addEventListener("click", async (e)=>{
  const tabBtn = e.target.closest(".tabbtn");
  if(tabBtn){
    document.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    tabBtn.classList.add("active");
    const id = tabBtn.dataset.tab;
    document.getElementById(id==="bible"?"panel-bible":"panel-ls").classList.add("active");
    document.querySelector("header.title-block").style.borderBottomColor = ACCENT[id];
    document.body.style.background = id==="bible" ? "#FCFBFF" : "#FAFDFB";
    return;
  }

  const viewChip = e.target.closest("[data-viewmode]");
  if(viewChip){
    VIEWMODE[viewChip.dataset.track] = viewChip.dataset.viewmode;
    OPEN[viewChip.dataset.track].clear();
    render(viewChip.dataset.track);
    return;
  }

  const chip = e.target.closest(".chip[data-filter]");
  if(chip){
    FILTER[chip.dataset.track] = chip.dataset.filter;
    render(chip.dataset.track);
    return;
  }

  const bulk = e.target.closest("[data-act='expand-all'],[data-act='collapse-all']");
  if(bulk){
    const trackId = bulk.dataset.track;
    const groups = currentGroups(trackId);
    const names = [...groups.ot, ...groups.nt].map(b=>b.name);
    if(bulk.dataset.act==="expand-all") names.forEach(n=>OPEN[trackId].add(n));
    else OPEN[trackId].clear();
    render(trackId);
    return;
  }

  const head = e.target.closest(".book-head");
  if(head && !head.classList.contains("book-head-static")){
    const trackId = head.dataset.track, book = head.dataset.book;
    if(OPEN[trackId].has(book)) OPEN[trackId].delete(book); else OPEN[trackId].add(book);
    render(trackId);
    return;
  }

  const tool = e.target.closest(".book-tools button");
  if(tool){
    const trackId = tool.dataset.track, book = tool.dataset.book;
    const groups = currentGroups(trackId);
    const g = [...groups.ot, ...groups.nt].find(b=>b.name===book);
    const set = readSet(trackId);
    if(tool.dataset.act==="all"){
      g.entries.forEach(en=>set.add(en.id));
    }else{
      g.entries.forEach(en=>set.delete(en.id));
    }
    STATE[trackId] = [...set];
    await saveState(trackId);
    render(trackId);
    return;
  }
});

/* ---------- drag-select checking ---------- */
let DRAG = { active:false, trackId:null, mode:null, touched:new Set() };

function applyVisual(el, checked){
  el.classList.toggle("read", checked);
  const checkSpan = el.querySelector && el.querySelector(".entry-check");
  if(checkSpan) checkSpan.textContent = checked ? "✓" : "";
}
function startDrag(el){
  const trackId = el.dataset.track;
  const wasChecked = el.classList.contains("read");
  DRAG = { active:true, trackId, mode: wasChecked ? "uncheck" : "check", touched:new Set() };
  applyVisual(el, DRAG.mode==="check");
  DRAG.touched.add(el.dataset.id);
}
function dragOver(el){
  if(!DRAG.active || !el || el.dataset.track !== DRAG.trackId) return;
  const id = el.dataset.id;
  if(DRAG.touched.has(id)) return;
  applyVisual(el, DRAG.mode==="check");
  DRAG.touched.add(id);
}
async function endDrag(){
  if(!DRAG.active) return;
  const trackId = DRAG.trackId, mode = DRAG.mode, touched = DRAG.touched;
  DRAG = { active:false, trackId:null, mode:null, touched:new Set() };
  if(touched.size===0) return;
  const set = readSet(trackId);
  touched.forEach(id => mode==="check" ? set.add(id) : set.delete(id));
  STATE[trackId] = [...set];
  await saveState(trackId);
  render(trackId);
}

document.addEventListener("mousedown", (e)=>{
  const el = e.target.closest(".entry-toggle");
  if(!el) return;
  e.preventDefault();
  startDrag(el);
});
document.addEventListener("mouseover", (e)=>{
  if(!DRAG.active) return;
  const el = e.target.closest(".entry-toggle");
  if(el) dragOver(el);
});
document.addEventListener("mouseup", ()=>{ if(DRAG.active) endDrag(); });

document.addEventListener("touchstart", (e)=>{
  const el = e.target.closest(".entry-toggle");
  if(!el) return;
  startDrag(el);
}, { passive:true });
document.addEventListener("touchmove", (e)=>{
  if(!DRAG.active) return;
  const touch = e.touches[0];
  const under = document.elementFromPoint(touch.clientX, touch.clientY);
  const el = under && under.closest(".entry-toggle");
  if(el) dragOver(el);
});
document.addEventListener("touchend", ()=>{ if(DRAG.active) endDrag(); });

/* ---------- init ---------- */
(async function init(){
  await loadState("bible");
  await loadState("ls");
  render("bible");
  render("ls");
})();
</script>
